name: WhisperKeyboard
options:
  bundleIdPrefix: com.omar.whisperkeyboard
  deploymentTarget:
    macOS: "13.3"
    iOS: "16.0"

packages:
  TranscriptionKit:
    path: Packages/TranscriptionKit
  AudioCaptureKit:
    path: Packages/AudioCaptureKit
  InputInjectionKit:
    path: Packages/InputInjectionKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 1.9.0

targets:
  WhisperKeyboard:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - WhisperKeyboard.entitlements
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/WhisperKeyboard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM is intentionally omitted rather than hardcoded: it's
        # machine/account-specific, so a value that works on one Mac breaks the build on
        # anyone else's. Xcode resolves it per-developer from whichever Apple ID is signed
        # into Xcode > Settings > Accounts (a free personal team is enough — no paid
        # Developer Program needed). The first build must happen from the Xcode GUI so it
        # can prompt for/create that team; after that, `xcodebuild` from the CLI works too.
        # A real (non-ad-hoc) team matters because the app's code signature is also its TCC
        # identity for Accessibility/Microphone — with no team, every rebuild gets a fresh
        # ad-hoc signature and macOS treats it as a brand new, never-approved app each time.
        PRODUCT_BUNDLE_IDENTIFIER: com.omar.whisperkeyboard
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        # Hardened Runtime is OFF for local dev: with no paid Developer ID team, the app
        # and the vendored whisper.framework are each independently ad-hoc signed (no
        # shared Team ID), and Hardened Runtime's library validation refuses to load a
        # framework whose signing identity doesn't match the host app's — even when both
        # are "adhoc". Turn this back on (and re-sign consistently) if this is ever
        # distributed via Developer ID + notarization.
        ENABLE_HARDENED_RUNTIME: NO
        # No com.apple.security.app-sandbox entitlement — see WhisperKeyboard.entitlements
        # for why sandboxing is incompatible with the Accessibility-based text insertion
        # this app depends on.
    dependencies:
      - package: TranscriptionKit
      - package: AudioCaptureKit
      - package: InputInjectionKit
      - package: KeyboardShortcuts

  WhisperKeyboardMobile:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: iOSApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Same reasoning as the macOS target: no hardcoded DEVELOPMENT_TEAM, resolved
        # per-developer via Xcode's GUI on first build (free personal team is enough).
        PRODUCT_BUNDLE_IDENTIFIER: com.omar.whisperkeyboard.mobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
    dependencies:
      - package: TranscriptionKit
      - package: AudioCaptureKit
